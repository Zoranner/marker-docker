[project]
name = "marker-api"
version = "0.1.0"
description = "HTTP adapter image for Marker"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.115.6",
    "marker-pdf[full]==2.0.0",
    "python-multipart==0.0.20",
    "uvicorn[standard]==0.34.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.4",
]
