name: Publish marker API image

on:
  workflow_call:
    inputs:
      marker_version:
        description: Stable Marker release version, without the v prefix
        required: true
        type: string
  workflow_dispatch:
    inputs:
      marker_version:
        description: Stable Marker release version, without the v prefix
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate version
        env:
          INPUT_MARKER_VERSION: ${{ inputs.marker_version }}
        shell: bash
        run: |
          set -euo pipefail
          marker_version="${INPUT_MARKER_VERSION:-}"
          [[ "$marker_version" =~ ^1\.[0-9]+\.[0-9]+$ ]]

      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.7.17

      - name: Lock target Marker version
        env:
          INPUT_MARKER_VERSION: ${{ inputs.marker_version }}
        shell: bash
        run: |
          set -euo pipefail
          uv add --no-sync "marker-pdf[full]==${INPUT_MARKER_VERSION}"
          uv lock --check

      - uses: docker/setup-buildx-action@v3

      - name: Build adapter image
        env:
          INPUT_MARKER_VERSION: ${{ inputs.marker_version }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --load \
            --tag marker-api:contract-test \
            .

      - name: Verify HTTP contract
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --name marker-api-contract-test \
            --publish 18000:8000 marker-api:contract-test
          trap 'docker rm --force marker-api-contract-test >/dev/null 2>&1 || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/health | jq -e '.status == "ok"' >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18000/health | jq -e '.status == "ok"' >/dev/null

          status="$(curl --silent --output response.json --write-out '%{http_code}' \
            --form 'file=@/dev/null;filename=empty.pdf' http://127.0.0.1:18000/marker)"
          test "$status" = 400
          jq -e '.detail == "uploaded file is empty"' response.json >/dev/null

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish image and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_MARKER_VERSION: ${{ inputs.marker_version }}
        run: |
          set -euo pipefail
          marker_version="${INPUT_MARKER_VERSION:-}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/marker-api"
          release_tag="v${marker_version}-r1"
          docker tag marker-api:contract-test "$image:${marker_version}-r1"
          docker push "$image:${marker_version}-r1"
          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            gh release create "$release_tag" \
              --title "Marker ${marker_version} adapter r1" \
              --notes "Marker ${marker_version} image passed the marker-api HTTP contract baseline."
          fi
