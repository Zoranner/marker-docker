name: Release Marker API

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: marker-upstream-release
  cancel-in-progress: false

jobs:
  resolve:
    name: Check Upstream Release
    runs-on: ubuntu-latest
    outputs:
      marker_version: ${{ steps.version.outputs.marker_version }}
      release_revision: ${{ steps.version.outputs.release_revision }}
      should_publish: ${{ steps.version.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch Release Tags
        shell: bash
        run: git fetch --force --tags origin

      - id: version
        shell: bash
        run: |
          set -euo pipefail
          marker_version="$(curl --fail-with-body --silent --show-error \
            https://api.github.com/repos/datalab-to/marker/releases/latest | jq -r '.tag_name')"
          marker_version="${marker_version#v}"
          [[ "$marker_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          decision="$(python scripts/resolve_release.py "$marker_version")"
          printf '%s\n' "$decision" >> "$GITHUB_OUTPUT"
          release_tag="$(printf '%s\n' "$decision" | awk -F= '$1 == "release_tag" { print $2 }')"
          release_revision="$(printf '%s\n' "$decision" | awk -F= '$1 == "release_revision" { print $2 }')"
          should_publish="$(printf '%s\n' "$decision" | awk -F= '$1 == "should_publish" { print $2 }')"

          if [[ "$should_publish" == true ]]; then
            echo "Marker $marker_version will be released as $release_tag after the image contract check." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Marker $marker_version image inputs are unchanged since $release_tag." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "marker_version=$marker_version" >> "$GITHUB_OUTPUT"

  prepare:
    name: Prepare Release
    needs: resolve
    if: needs.resolve.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - id: version
        name: Validate Release Version
        shell: bash
        env:
          MARKER_VERSION: ${{ needs.resolve.outputs.marker_version }}
          RELEASE_REVISION: ${{ needs.resolve.outputs.release_revision }}
        run: |
          set -euo pipefail
          [[ "$MARKER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$RELEASE_REVISION" =~ ^[1-9][0-9]*$ ]]
          version="${MARKER_VERSION}-r${RELEASE_REVISION}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/zoranner/marker-api" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$version" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify Image Contract
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.7.17

      - name: Lock Target Marker Version
        shell: bash
        env:
          MARKER_VERSION: ${{ needs.resolve.outputs.marker_version }}
        run: |
          set -euo pipefail
          uv add --no-sync "marker-pdf[full]==${MARKER_VERSION}"
          uv lock --check

      - uses: docker/setup-buildx-action@v4

      - name: Build Contract Image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --load \
            --tag marker-api:contract-test \
            .

      - name: Verify HTTP Contract
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --rm --name marker-api-contract-test \
            --publish 18000:8000 marker-api:contract-test
          trap 'docker logs marker-api-contract-test || true; docker rm --force marker-api-contract-test >/dev/null 2>&1 || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/health | jq -e '.status == "ok"' >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18000/health | jq -e '.status == "ok"' >/dev/null

          status="$(curl --silent --output response.json --write-out '%{http_code}' \
            --form 'file=@/dev/null;filename=empty.pdf' http://127.0.0.1:18000/marker)"
          test "$status" = 400
          jq -e '.detail == "uploaded file is empty"' response.json >/dev/null

          base64 --decode tests/fixtures/marker-contract.pdf.base64 > marker-contract.pdf
          status="$(curl --silent --show-error --max-time 1200 --output response.json --write-out '%{http_code}' \
            --form 'file=@marker-contract.pdf;type=application/pdf' http://127.0.0.1:18000/marker)"
          test "$status" = 200
          jq -e '.markdown | type == "string" and length > 0' response.json >/dev/null
          jq -er '.markdown' response.json | tr -s '[:space:]' ' ' | grep --fixed-strings 'Marker API contract' >/dev/null

  build-platform:
    name: Build Image (${{ matrix.platform }})
    needs: [prepare, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            archive_suffix: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            archive_suffix: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.7.17

      - name: Lock Target Marker Version
        shell: bash
        env:
          MARKER_VERSION: ${{ needs.resolve.outputs.marker_version }}
        run: |
          set -euo pipefail
          uv add --no-sync "marker-pdf[full]==${MARKER_VERSION}"
          uv lock --check

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      - name: Export Offline Image Parts
        shell: bash
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          archive="marker-api-${VERSION}-${{ matrix.archive_suffix }}.tar"
          docker pull "$IMAGE@$DIGEST"
          image_id="$(docker image inspect --format '{{.Id}}' "$IMAGE@$DIGEST")"
          docker image tag "$image_id" "$IMAGE:$VERSION"
          docker image save --output "$archive" "$IMAGE:$VERSION"
          split --bytes=1900m --numeric-suffixes=1 --suffix-length=2 \
            "$archive" "${archive}.part-"
          sha256sum "${archive}".part-* > "${archive}.sha256"
          rm "$archive"
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"

      - name: Upload Platform Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: marker-api-${{ matrix.archive_suffix }}
          path: |
            marker-api-${{ needs.prepare.outputs.version }}-${{ matrix.archive_suffix }}.tar.part-*
            marker-api-${{ needs.prepare.outputs.version }}-${{ matrix.archive_suffix }}.tar.sha256
            digests/*
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: [prepare, build-platform]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download Platform Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: marker-api-*
          path: artifacts
          merge-multiple: true

      - name: Create Multi-platform Image
        shell: bash
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t digest_files < <(find artifacts -type f -path '*/digests/*' | sort)
          test "${#digest_files[@]}" -eq 2
          references=()
          for digest_file in "${digest_files[@]}"; do
            references+=("$IMAGE@sha256:$(basename "$digest_file")")
          done
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            "${references[@]}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Marker API ${{ needs.prepare.outputs.version }}
          body: |
            Image: ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.version }}
            Offline image parts: marker-api-${{ needs.prepare.outputs.version }}-linux-amd64.tar.part-*, marker-api-${{ needs.prepare.outputs.version }}-linux-arm64.tar.part-*
            Checksums: marker-api-${{ needs.prepare.outputs.version }}-linux-amd64.tar.sha256, marker-api-${{ needs.prepare.outputs.version }}-linux-arm64.tar.sha256
          files: |
            artifacts/marker-api-*.tar.part-*
            artifacts/marker-api-*.tar.sha256
          fail_on_unmatched_files: true
          overwrite_files: true
