name: Check Upstream Release

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: marker-upstream-release
  cancel-in-progress: false

jobs:
  resolve:
    name: Check Upstream Release
    runs-on: ubuntu-latest
    outputs:
      marker_version: ${{ steps.version.outputs.marker_version }}
      release_revision: ${{ steps.version.outputs.release_revision }}
      should_publish: ${{ steps.version.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch Release Tags
        shell: bash
        run: git fetch --force --tags origin

      - id: version
        shell: bash
        run: |
          set -euo pipefail
          marker_version="$(curl --fail-with-body --silent --show-error \
            https://api.github.com/repos/datalab-to/marker/releases/latest | jq -r '.tag_name')"
          marker_version="${marker_version#v}"
          [[ "$marker_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

          decision="$(python scripts/resolve_release.py "$marker_version")"
          printf '%s\n' "$decision" >> "$GITHUB_OUTPUT"
          release_tag="$(printf '%s\n' "$decision" | awk -F= '$1 == "release_tag" { print $2 }')"
          release_revision="$(printf '%s\n' "$decision" | awk -F= '$1 == "release_revision" { print $2 }')"
          should_publish="$(printf '%s\n' "$decision" | awk -F= '$1 == "should_publish" { print $2 }')"

          if [[ "$should_publish" == true ]]; then
            echo "Marker $marker_version will be released as $release_tag after the image contract check." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Marker $marker_version image inputs are unchanged since $release_tag." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "marker_version=$marker_version" >> "$GITHUB_OUTPUT"

  publish:
    name: Release Marker API Image
    needs: resolve
    if: needs.resolve.outputs.should_publish == 'true'
    uses: ./.github/workflows/publish-image.yml
    with:
      marker_version: ${{ needs.resolve.outputs.marker_version }}
      release_revision: ${{ needs.resolve.outputs.release_revision }}
    secrets: inherit
